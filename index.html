.tab {

    background: #2b2b2b;

.roulette-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    display: flex;
    align-items: center;
    justify-content: center;

    height: 750px;

<script type="module">

let genresMap = {};
async function loadGenres() {
    const res = await fetch(`https://api.themoviedb.org/3/genre/movie/list?api_key=${TMDB_API_KEY}&language=ru-RU`);
    const data = await res.json();
    data.genres.forEach(g => genresMap[g.id] = g.name);
}
await loadGenres();

// Функция конвертации изображения в base64
async function imageToBase64(url) {
    if (!url) return null;
    
    try {
        const sources = [
            url,
            url.replace('image.tmdb.org', 'tmdb.org'),
            url.replace('w300', 'original')
        ];
        
        for (const src of sources) {
            try {
                const response = await fetch(src, { 
                    mode: 'cors',
                    cache: 'force-cache'
                });
                
                if (!response.ok) continue;
                
                const blob = await response.blob();
                
                if (blob.size > 500 * 1024) {
                    return await compressImage(blob);
                }
                
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onloadend = () => resolve(reader.result);
                    reader.onerror = reject;
                    reader.readAsDataURL(blob);
                });
            } catch (e) {
                continue;
            }
        }
    } catch (e) {
        console.error("Ошибка загрузки изображения:", e);
        return null;
    }
    return null;
}

// Функция сжатия больших изображений
async function compressImage(blob) {
    return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            
            const maxWidth = 300;
            const scale = maxWidth / img.width;
            canvas.width = maxWidth;
            canvas.height = img.height * scale;
            
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            
            const base64 = canvas.toDataURL('image/jpeg', 0.8);
            resolve(base64);
        };
        img.src = URL.createObjectURL(blob);
    });
}

async function fetchMovie(title, year = null) {
    const url = new URL("https://api.themoviedb.org/3/search/movie");
    url.searchParams.set("api_key", TMDB_API_KEY);
    url.searchParams.set("query", title);
    url.searchParams.set("language", "ru-RU");
    if (year) url.searchParams.set("year", year);

    const res = await fetch(url);
    const data = await res.json();

    if (!data.results || !data.results.length) return null;

    let movie = data.results.find(m => m.title.toLowerCase() === title.toLowerCase());
    if (!movie) movie = data.results[0];

    const genreNames = movie.genre_ids.map(id => genresMap[id]).join(", ");
    
    let posterUrl = movie.poster_path ? TMDB_IMG + movie.poster_path : "";
    
    return { 
        ...movie, 
        poster: posterUrl,
        genreNames, 
        overview: movie.overview || "" 
    };
}

async function fetchTrailer(movieId) {
    const res = await fetch(
        `https://api.themoviedb.org/3/movie/${movieId}/videos?api_key=${TMDB_API_KEY}&language=ru-RU`
    );
    const data = await res.json();
    const yt = data.results?.find(v => v.site === "YouTube" && v.type === "Trailer");
    return yt ? `https://www.youtube.com/embed/${yt.key}` : null;
}

async function loadMovies() {
    try {
        const snapshot = await getDocs(collection(db, "movies"));
        state.movies = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
        localStorage.setItem("movies_backup", JSON.stringify(state.movies));
    } catch (e) {
        console.log("Firebase ошибка, грузим из localStorage:", e);
        const saved = localStorage.getItem("movies_backup");
        state.movies = saved ? JSON.parse(saved) : [];
    }
    render();
}

// Функция для обновления старых фильмов
async function migrateOldMovies() {
    const oldMovies = state.movies.filter(m => m.poster && !m.poster.startsWith('data:'));
    
    for (const movie of oldMovies) {
        try {
            console.log(`Обновляем постер для: ${movie.title}`);
            const base64 = await imageToBase64(movie.poster);
            if (base64) {
                await updateDoc(doc(db, "movies", movie.id), {
                    poster: base64
                });
            }
        } catch (e) {
            console.error(`Ошибка обновления ${movie.title}:`, e);
        }
    }
    await loadMovies();
}

function renderSidebar() {
    sidebar.innerHTML = "<h2></h2>";

    const tabs = document.createElement("div");
    tabs.className = "tabs";

    const normalTab = document.createElement("div");
    normalTab.className = "tab" + (state.tab === "normal" ? " active" : "");
    normalTab.textContent = "Обычные";
    normalTab.onclick = () => { state.tab = "normal"; render(); };

    const horrorTab = document.createElement("div");
    horrorTab.className = "tab" + (state.tab === "horror" ? " active" : "");
    horrorTab.textContent = "Ужастики";
    horrorTab.onclick = () => { state.tab = "horror"; render(); };

    tabs.appendChild(normalTab);
    tabs.appendChild(horrorTab);
    sidebar.appendChild(tabs);

    const rouletteBtn = document.createElement("button");
    rouletteBtn.textContent = "🙈🤙🍌";
    rouletteBtn.style.width = "100%";
    rouletteBtn.style.margin = "10px 0";
    rouletteBtn.style.fontSize = "16px";

    rouletteBtn.onclick = () => {
        overlay.classList.remove("hidden");
        angle = 0;
        speed = 0;
        spinning = false;

        rouletteMovies = state.movies.filter(m => {
            if (m.viewed) return false;
            const isHorror = m.genres?.toLowerCase().includes("ужасы");
            return state.tab === "horror" ? isHorror : !isHorror;
        });
        drawRoulette();
    };

    sidebar.appendChild(rouletteBtn);

    if (state.user === "Кола") {
        const migrateBtn = document.createElement("button");
        migrateBtn.textContent = "🔄 Обновить постеры старых фильмов";
        migrateBtn.style.width = "100%";
        migrateBtn.style.margin = "10px 0";
        migrateBtn.style.background = "#4a4a4a";
        migrateBtn.onclick = async () => {
            migrateBtn.disabled = true;
            migrateBtn.textContent = "Обновление...";
            await migrateOldMovies();
            migrateBtn.textContent = "Готово!";
            setTimeout(() => {
                migrateBtn.textContent = "🔄 Обновить постеры старых фильмов";
                migrateBtn.disabled = false;
            }, 2000);
        };
        sidebar.appendChild(migrateBtn);
    }

    state.movies
        .filter(m => {
            if (m.viewed) return false;
            const isHorror = m.genres?.toLowerCase().includes("ужасы");
            return state.tab === "horror" ? isHorror : !isHorror;
        })
        .sort((a,b)=>b.createdAt - a.createdAt)
        .forEach(m => {
            const d = document.createElement("div");
            d.className = "movie-item" + (m.id===selectedMovieId?" selected":"");
            d.innerHTML = `<strong>${m.title}</strong> <span style="float:right; color:#ccc;">⭐ ${m.tmdbRating}</span>`;
            d.onclick = () => { selectedMovieId = m.id; render(); };
            sidebar.appendChild(d);
        });

    const container = document.createElement("div");
    container.className = "add-movie-container";

    const i = document.createElement("input");
    i.placeholder = "Название фильма";

    const b = document.createElement("button");
    b.textContent = "➕ Добавить";

    b.onclick = async () => {
        if (!i.value.trim()) return;
        b.disabled = true;
        b.textContent = "Поиск...";

        const input = i.value.trim();
        const match = input.match(/(.*)\s(\d{4})$/);
        let title = input;
        let year = null;

        if (match) {
            title = match[1].trim();
            year = parseInt(match[2]);
        }

        const m = await fetchMovie(title, year);
        if (!m) {
            b.textContent = "Не найдено";
            setTimeout(() => {
                b.textContent = "➕ Добавить";
                b.disabled = false;
            }, 1000);
            return;
        }

        b.textContent = "Загрузка постера...";
        
        let posterBase64 = "";
        if (m.poster) {
            posterBase64 = await imageToBase64(m.poster) || "";
        }

        b.textContent = "Загрузка трейлера...";
        const trailer = await fetchTrailer(m.id);

        const newMovie = {
            title: m.title,
            poster: posterBase64,
            tmdbRating: m.vote_average?.toFixed(1) || "—",
            year: m.release_date?.slice(0, 4) || "",
            overview: m.overview || "",
            trailer: trailer || "",
            userRatings: {},
            createdAt: Date.now(),
            creator: state.user,
            genres: m.genreNames || "",
            viewed: false
        };

        await setDoc(doc(db, "movies", crypto.randomUUID()), newMovie);
        await loadMovies();

        i.value = "";
        b.disabled = false;
        b.textContent = "➕ Добавить";
    };

    container.appendChild(i);
    container.appendChild(b);
    sidebar.appendChild(container);

    const viewedContainer = document.createElement("div");
    viewedContainer.className = "viewed-container";

    const toggleBtn = document.createElement("button");
    toggleBtn.className = "viewed-toggle";
    toggleBtn.textContent = "👁 Просмотрено";

    const viewedList = document.createElement("div");
    viewedList.className = "viewed-list";
    viewedList.style.display = state.viewedOpen ? "block" : "none";

    toggleBtn.onclick = () => {
        state.viewedOpen = !state.viewedOpen;
        render();
    };

    state.movies
        .filter(m => m.viewed)
        .sort((a,b) => (b.viewedAt || 0) - (a.viewedAt || 0))
        .forEach(m => {
            const d = document.createElement("div");
            d.className = "movie-item" + (m.id===selectedMovieId?" selected":"");
            d.innerHTML = `<strong>${m.title}</strong> <span style="float:right; color:#ccc;">⭐ ${m.tmdbRating}</span>`;
            d.onclick = () => { selectedMovieId = m.id; render(); };
            viewedList.appendChild(d);
        });

    viewedContainer.appendChild(toggleBtn);
    viewedContainer.appendChild(viewedList);
    sidebar.appendChild(viewedContainer);
}

function renderMain() {
    main.innerHTML = "";

    if (!state.user) {
        main.innerHTML = `
            <div class="login-container">
                <input id="nick" placeholder="Ник">
                <button id="login">Войти</button>
            </div>
        `;
        document.getElementById("login").onclick = () => {
            const nick = document.getElementById("nick").value.trim();
            if (!nick) return;
            state.user = nick;
            localStorage.setItem("movieAppUser", nick);
            render();
        };
        return;
    }

    const userMovies = state.movies.filter(m => m.creator === state.user);
    main.innerHTML += `
        <div class="profile">
            <strong>${state.user}</strong>
            Добавлено фильмов: ${userMovies.length}
        </div>
    `;

    if (!selectedMovieId) return;

    const m = state.movies.find(x => x.id === selectedMovieId);

    <div style="position: relative; width:300px; z-index:2; display: flex; flex-direction: column; gap: 6px;">
        <h2 style="color: #fff; font-size: 24px; margin:0 0 15px 0;">
            ${m.title} (${m.year})
        </h2>

        ${m.poster ? `
            <img class="poster-main" 
                 src="${m.poster}" 
                 alt="${m.title}"
                 style="border-radius:12px; width:100%; z-index:2; background: #333; cursor: ${m.trailer ? 'pointer' : 'default'};"
                 loading="lazy">
        ` : `
            <div style="width:100%; height:450px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
                       border-radius:12px; display: flex; align-items: center; justify-content: center;">
                <span style="color: white; font-size: 24px; text-align: center; padding: 20px;">
                    ${m.title}
                </span>
            </div>
        `}

        ${m.poster ? `
            <div style="
                position:absolute;
                top:50%; left:50%;
                width:1900px; height:900px;
                transform: translate(-50%, -50%) scale(1.2);
                z-index:0;
                pointer-events:none;
                border-radius:50%;
                overflow:hidden;
                filter: blur(80px) saturate(1.6) brightness(1.15);
                opacity:0.55;
            ">
                <img src="${m.poster}" style="width:100%; height:100%; object-fit:cover;">
            </div>
        ` : ""}
    </div>
    `;

    const textDiv = document.createElement("div");
    textDiv.className = "movie-text-bg";
    textDiv.style.marginTop = "10px"; 
    textDiv.style.width = "500px";     
    textDiv.innerHTML = `
        <p>TMDb: ${m.tmdbRating}</p>
        <p>Жанры: ${m.genres || "не указаны"}</p>
        ${m.overview ? `<p><strong>Описание:</strong><br>${m.overview}</p>` : ""}
    `;
    main.appendChild(textDiv);

    if (state.user === "Кола") {
        const viewedBtn = document.createElement("button");
        viewedBtn.textContent = m.viewed ? "✅ Просмотрено" : "👁 Отметить просмотренным";
        viewedBtn.style.display = "block";
        viewedBtn.style.marginTop = "10px";
        viewedBtn.style.background = m.viewed ? "#2a5" : "#3a3a3a";
        viewedBtn.onclick = async () => {
            if (!m.viewed) {
                await updateDoc(doc(db, "movies", m.id), { viewed: true, viewedAt: Date.now() });
                await loadMovies();
            }
        };
        main.appendChild(viewedBtn);

        const delBtn = document.createElement("button");
        delBtn.textContent = "🗑 Удалить фильм";
        delBtn.style.background = "#a33";
        delBtn.style.marginTop = "10px";
        delBtn.onclick = async () => {
            if (confirm(`Вы уверены, что хотите удалить "${m.title}"?`)) {
                await deleteDoc(doc(db, "movies", m.id));
                selectedMovieId = null;
                await loadMovies();
            }
        };
        main.appendChild(delBtn);

    if (m.poster && m.trailer) {

        if (posterImg) {
            posterImg.style.cursor = "pointer";
            posterImg.onclick = () => {
                const overlay = document.createElement("div");
                overlay.style.position = "fixed";
                overlay.style.top = "0";
                overlay.style.left = "0";
                overlay.style.width = "100vw";
                overlay.style.height = "100vh";
                overlay.style.background = "rgba(0,0,0,0.8)";
                overlay.style.display = "flex";
                overlay.style.justifyContent = "center";
                overlay.style.alignItems = "center";
                overlay.style.zIndex = "9999";

                const trailerContainer = document.createElement("div");

                const iframe = document.createElement("iframe");
                iframe.src = m.trailer;

                iframe.height = "500";
                iframe.frameBorder = "0";
                iframe.allowFullscreen = true;
                iframe.style.borderRadius = "12px";

                const closeBtn = document.createElement("button");
                closeBtn.textContent = "✖";
                closeBtn.style.position = "absolute";
                closeBtn.style.top = "-30px";
                closeBtn.style.right = "-30px";
                closeBtn.style.fontSize = "24px";
                closeBtn.style.background = "#a33";
                closeBtn.style.color = "#fff";
                closeBtn.style.border = "none";
                closeBtn.style.borderRadius = "50%";
                closeBtn.style.width = "40px";
                closeBtn.style.height = "40px";
                closeBtn.style.cursor = "pointer";
                closeBtn.onclick = () => document.body.removeChild(overlay);

                trailerContainer.appendChild(iframe);
                trailerContainer.appendChild(closeBtn);
                overlay.appendChild(trailerContainer);
                document.body.appendChild(overlay);
            };
        }
    }
}

// ===== Рулетка =====
const overlay = document.getElementById("rouletteOverlay");
const canvas = document.getElementById("rouletteCanvas");
const ctx = canvas.getContext("2d");

let angle = 0;
let speed = 0;
let spinning = false;
const rouletteColors = ["#f1b71c","#0c9e2f","#3e72e9","#d72135"];
let previousIndex = -1;
let rouletteMovies = [];

document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
        overlay.classList.add("hidden");
        spinning = false;
    }
});

function startRoulette() {
    if (rouletteMovies.length === 0) {
        rouletteMovies = state.movies.filter(m => {
            if (m.viewed) return false;
            const isHorror = m.genres?.toLowerCase().includes("ужасы");
            return state.tab === "horror" ? isHorror : !isHorror;
        });
    }

    if (!rouletteMovies.length) {
        alert("Нет фильмов 😢");
        return;
    }

    angle = 0;
    speed = Math.random() * 0.3 + 0.35;
    spinning = true;
    overlay.classList.remove("hidden");
    requestAnimationFrame(spin);
    previousIndex = -1;
}

function spin() {
    if (!spinning) return;
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const cx = 375, cy = 375, radius = 350;
    const slice = (Math.PI * 2) / rouletteMovies.length;

    const pointerAngle = (-Math.PI/2 - angle) % (Math.PI*2);
    const normalized = (pointerAngle + 2*Math.PI) % (2*Math.PI);
    const currentIndex = Math.floor(normalized / slice);

    if (currentIndex !== previousIndex) {
        try {
            const maxVolume = 0.3;
            const minVolume = 0.03;
            const normalizedVolume = maxVolume - speed * (maxVolume - minVolume);
            const tick = new Audio('tick.mp3');
            tick.volume = Math.max(normalizedVolume, minVolume);
            tick.play();
        } catch (e) {}
        previousIndex = currentIndex;
    }

    rouletteMovies.forEach((m,i)=>{
        const start = angle + i*slice;
        const end = start + slice;
        ctx.beginPath();
        ctx.moveTo(cx,cy);
        ctx.arc(cx,cy,radius,start,end);
        ctx.fillStyle = rouletteColors[i % rouletteColors.length];
        ctx.fill();
        ctx.strokeStyle = "#ffffff55";
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.save();
        ctx.translate(cx,cy);
        ctx.rotate(start + slice/2);
        ctx.textAlign = "right";
        ctx.fillStyle = "#fff";
        ctx.font = "bold 23px Arial";
        ctx.shadowColor = "rgba(0,0,0,0.6)";
        ctx.shadowBlur = 4;
        ctx.fillText(m.title.slice(0,22), radius-14,5);
        ctx.shadowBlur = 0;
        ctx.restore();
    });

    ctx.beginPath();
    ctx.arc(cx,cy,10,0,Math.PI*2);
    ctx.fillStyle = "#ffd166";
    ctx.fill();

    angle += speed;
    speed *= 0.992;

    if (speed < 0.0002) {
        spinning = false;
        const pointerAngleFinal = (-Math.PI/2 - angle) % (2*Math.PI);
        const normalizedFinal = (pointerAngleFinal + 2*Math.PI) % (2*Math.PI);
        const finalIndex = Math.floor(normalizedFinal / slice);
        if (rouletteMovies[finalIndex]) {
            selectedMovieId = rouletteMovies[finalIndex].id;
            render();
        }
        rouletteMovies.splice(finalIndex,1);
        angle = 0;
        drawRoulette();
        return;
    }

    requestAnimationFrame(spin);
}

function drawRoulette() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    if (!rouletteMovies.length) return;
    
    const cx = 375, cy = 375, radius = 350;
    const slice = (Math.PI*2)/rouletteMovies.length;

    rouletteMovies.forEach((m,i)=>{
        const start = i*slice;
        const end = start + slice;
        ctx.beginPath();
        ctx.moveTo(cx,cy);
        ctx.arc(cx,cy,radius,start,end);
        ctx.fillStyle = rouletteColors[i % rouletteColors.length];
        ctx.fill();
        ctx.strokeStyle = "#ffffff55";
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.save();
        ctx.translate(cx,cy);
        ctx.rotate(start + slice/2);
        ctx.textAlign = "right";
        ctx.fillStyle = "#fff";
        ctx.font = "bold 23px Arial";
        ctx.shadowColor = "rgba(0,0,0,0.6)";
        ctx.shadowBlur = 4;
        ctx.fillText(m.title.slice(0,22), radius-14,5);
        ctx.shadowBlur = 0;
        ctx.restore();
    });

    ctx.beginPath();
    ctx.arc(cx,cy,10,0,Math.PI*2);
    ctx.fillStyle = "#ffd166";
    ctx.fill();
}

canvas.style.cursor = "pointer";
canvas.addEventListener("click", ()=>{ if(!spinning) startRoulette(); });

// Глобальный обработчик ошибок загрузки изображений
document.addEventListener('error', function(e) {
    const target = e.target;
    if (target.tagName === 'IMG' && target.classList.contains('poster-main')) {
        e.stopPropagation();
        e.preventDefault();
        
        const canvas = document.createElement('canvas');
        canvas.width = 300;
        canvas.height = 450;
        const ctx = canvas.getContext('2d');
        
        const gradient = ctx.createLinearGradient(0, 0, 300, 450);
        gradient.addColorStop(0, '#2c3e50');
        gradient.addColorStop(1, '#3498db');
        
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, 300, 450);
        
        ctx.fillStyle = 'white';
        ctx.font = 'bold 24px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(target.alt || 'Постер', 150, 225);
        
        target.src = canvas.toDataURL();
        target.onerror = null;
    }
}, true);

function render() {
    renderSidebar();
    renderMain();
}

loadMovies();
</script>
</head>
<body>
<div id="sidebar"></div>
<div id="main"></div>
<div id="rouletteOverlay" class="roulette-overlay hidden">
    <div class="roulette-pointer">▼</div>
    <canvas id="rouletteCanvas" width="750" height="750"></canvas>
</div>
</body>
