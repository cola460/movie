<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Movie App (TMDb + Firebase)</title>

<style>
body {
    margin: 0;
    background: #1e1e1e;
    color: #eee;
    font-family: Arial, sans-serif;
    display: flex;
    height: 100vh;
}
#sidebar {
    width: 320px;
    background: #2b2b2b;
    padding: 15px;
    overflow-y: auto;
}
#main {
    flex: 1;
    padding: 20px;
    overflow-y: auto;
    position: relative;
}
input, button {
    border-radius: 6px;
    border: none;
    background: #3a3a3a;
    color: #eee;
    margin: 6px 0;
    padding: 8px;
}
button { cursor: pointer; }
.movie-item { padding: 8px; border-bottom: 1px solid #444; cursor: pointer; }
.movie-item:hover { background: #3a3a3a; }
.selected { background: #555; }
.rating button { width: 32px; margin: 2px; }

/* ПРОФИЛЬ В ЛЕВОМ НИЖНЕМ УГЛУ */
.profile {
    position: fixed;
    bottom: 20px;
    left: 20px;
    background: #2b2b2b;
    padding: 10px 15px;
    border: 1px solid #444;
}
.profile strong {
    display: block;
    margin-bottom: 6px;
}

/* ЛОГИН ПО ЦЕНТРУ */
.login-container {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    height: 100%;
}
.login-container input,
.login-container button {
    width: 220px;
    padding: 8px 10px;
    margin: 5px 0;
}

/* ПОЛЕ И КНОПКА ДЛЯ ДОБАВЛЕНИЯ ФИЛЬМА */
.add-movie-container {
    display: flex;
    flex-direction: column;
    gap: 6px;
}
.add-movie-container input,
.add-movie-container button {
    width: 100%;
    box-sizing: border-box;
}

.viewed-container {
    margin-top: 20px;
}
.viewed-toggle {
    background: #3a3a3a;
    padding: 6px 10px;
    border: none;
    cursor: pointer;
    width: 100%;
    text-align: left;
}
.viewed-list {
    display: none;
    margin-top: 6px;
    border-top: 1px solid #444;
    padding-top: 6px;
}
</style>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import { getFirestore, collection, getDocs, setDoc, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

const TMDB_API_KEY = "2ca8d6767ce5b1e65da06ab763f5c6b1";
const IMG = "https://image.tmdb.org/t/p/w300";

const firebaseConfig = {
    apiKey: "AIzaSyAankTW1IXlRygRzAFJh2r0LmE6IjJJk50",
    authDomain: "movies-b2504.firebaseapp.com",
    projectId: "movies-b2504",
    storageBucket: "movies-b2504.firebasestorage.app",
    messagingSenderId: "857966785940",
    appId: "1:857966785940:web:5f84725a9049e047068b81"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let state = { user: null, movies: [], viewedOpen: false };
let selectedMovieId = null;

const sidebar = document.getElementById("sidebar");
const main = document.getElementById("main");

const savedUser = localStorage.getItem("movieAppUser");
if (savedUser) state.user = savedUser;

function avg(movie) {
    const v = Object.values(movie.userRatings || {});
    if (!v.length) return "—";
    return (v.reduce((a,b)=>a+b,0)/v.length).toFixed(1);
}

let genresMap = {};
async function loadGenres() {
    const res = await fetch(`https://api.themoviedb.org/3/genre/movie/list?api_key=${TMDB_API_KEY}&language=ru-RU`);
    const data = await res.json();
    data.genres.forEach(g => genresMap[g.id] = g.name);
}
await loadGenres();

async function fetchMovie(title) {
    const res = await fetch(
        `https://api.themoviedb.org/3/search/movie?api_key=${TMDB_API_KEY}&query=${encodeURIComponent(title)}&language=ru-RU`
    );
    const data = await res.json();
    const movie = data.results?.[0] || null;
    if (!movie) return null;
    const genreNames = movie.genre_ids.map(id => genresMap[id]).join(", ");
    return { ...movie, genreNames };
}

async function loadMovies() {
    const snapshot = await getDocs(collection(db, "movies"));
    state.movies = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
    render();
}

function renderSidebar() {
    sidebar.innerHTML = "<h2>Фильмы</h2>";

    // --- основной список (новые сверху) ---
    state.movies
        .filter(m => !m.viewedBy?.[state.user])
        .sort((a,b)=>b.createdAt - a.createdAt)
        .forEach(m => {
            const d = document.createElement("div");
            d.className = "movie-item" + (m.id===selectedMovieId?" selected":"");
            d.innerHTML = `<strong>${m.title}</strong><br>⭐ ${avg(m)}`;
            d.onclick = () => { selectedMovieId = m.id; render(); };
            sidebar.appendChild(d);
        });

    // --- кнопка добавления фильма ---
    const container = document.createElement("div");
    container.className = "add-movie-container";

    const i = document.createElement("input");
    i.placeholder = "Название фильма";

    const b = document.createElement("button");
    b.textContent = "➕ Добавить";

    b.onclick = async () => {
        if (!i.value.trim()) return;
        b.disabled = true;
        b.textContent = "Поиск...";

        const m = await fetchMovie(i.value.trim());
        if (!m) { 
            b.textContent = "Не найдено"; 
            setTimeout(()=>{b.textContent="➕ Добавить"; b.disabled=false;},1000); 
            return; 
        }

        const newMovie = {
            title: m.title,
            poster: m.poster_path ? IMG + m.poster_path : "",
            tmdbRating: m.vote_average?.toFixed(1) || "—",
            year: m.release_date?.slice(0,4) || "",
            userRatings: {},
            createdAt: Date.now(),
            creator: state.user,
            genres: m.genreNames,
            viewedBy: {}
        };

        await setDoc(doc(db, "movies", crypto.randomUUID()), newMovie);
        await loadMovies();

        i.value = "";
        b.disabled = false;
        b.textContent = "➕ Добавить";
    };

    container.appendChild(i);
    container.appendChild(b);
    sidebar.appendChild(container);

    // --- блок просмотренных фильмов ---
    const viewedContainer = document.createElement("div");
    viewedContainer.className = "viewed-container";

    const toggleBtn = document.createElement("button");
    toggleBtn.className = "viewed-toggle";
    toggleBtn.textContent = "👁 Просмотрено";

    const viewedList = document.createElement("div");
    viewedList.className = "viewed-list";
    viewedList.style.display = state.viewedOpen ? "block" : "none";

    toggleBtn.onclick = () => {
        state.viewedOpen = !state.viewedOpen;
        render();
    };

    // --- просмотренные фильмы (новые сверху) ---
    state.movies
        .filter(m => m.viewedBy?.[state.user])
        .sort((a,b)=>b.createdAt - a.createdAt)
        .forEach(m => {
            const d = document.createElement("div");
            d.className = "movie-item" + (m.id===selectedMovieId?" selected":"");
            d.innerHTML = `<strong>${m.title}</strong> ⭐ ${avg(m)}`;
            d.onclick = () => { selectedMovieId = m.id; render(); };
            viewedList.appendChild(d);
        });

    viewedContainer.appendChild(toggleBtn);
    viewedContainer.appendChild(viewedList);
    sidebar.appendChild(viewedContainer);
}

function renderMain() {
    main.innerHTML = "";

    if (!state.user) {
        main.innerHTML = `
            <div class="login-container">
                <input id="nick" placeholder="Ник">
                <button id="login">Войти</button>
            </div>
        `;
        document.getElementById("login").onclick = () => {
            const nick = document.getElementById("nick").value.trim();
            if (!nick) return;
            state.user = nick;
            localStorage.setItem("movieAppUser", nick);
            render();
        };
        return;
    }

    const userMovies = state.movies.filter(m => m.creator === state.user);
    main.innerHTML += `
    <div class="profile">
        <strong>${state.user}</strong>
        Добавлено фильмов: ${userMovies.length}
    </div>
`;

    if (!selectedMovieId) return;

    const m = state.movies.find(x=>x.id===selectedMovieId);

    main.innerHTML += `
        <h2>${m.title} (${m.year})</h2>
        ${m.poster ? `<img src="${m.poster}">` : ""}
        <p>TMDb: ${m.tmdbRating}</p>
        <p>Жанры: ${m.genres}</p>
        <p>Средняя оценка пользователей: ${avg(m)}</p>
    `;

    // --- кнопка "просмотрено" с глазиком ---
    const viewedBtn = document.createElement("button");
    viewedBtn.textContent = m.viewedBy?.[state.user] ? "👁 Просмотрено" : "👁 Отметить просмотрено";
    viewedBtn.style.marginTop = "6px";
    viewedBtn.onclick = async () => {
        if (!m.viewedBy) m.viewedBy = {};
        m.viewedBy[state.user] = true;
        await updateDoc(doc(db, "movies", m.id), { viewedBy: m.viewedBy });
        await loadMovies();
    };
    main.appendChild(viewedBtn);

    const r = document.createElement("div");
    r.className = "rating";
    for (let i=1;i<=10;i++) {
        const bt = document.createElement("button");
        bt.textContent = i;
        if (m.userRatings[state.user]===i) bt.style.background="#555";
        bt.onclick = async () => {
            m.userRatings[state.user] = i;
            await updateDoc(doc(db, "movies", m.id), { userRatings: m.userRatings });
            await loadMovies();
        };
        r.appendChild(bt);
    }
    main.appendChild(r);

    if (state.user === "Кола") {
        const delBtn = document.createElement("button");
        delBtn.textContent = "🗑 Удалить фильм";
        delBtn.style.background = "#a33";
        delBtn.style.marginTop = "10px";
        delBtn.onclick = async () => {
            if (confirm(`Вы уверены, что хотите удалить "${m.title}"?`)) {
                await deleteDoc(doc(db, "movies", m.id));
                selectedMovieId = null;
                await loadMovies();
            }
        };
        main.appendChild(delBtn);
    }
}

function render() {
    renderSidebar();
    renderMain();
}

loadMovies();
</script>
</head>
<body>
<div id="sidebar"></div>
<div id="main"></div>
</body>
</html>
