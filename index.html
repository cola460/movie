<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="favicon-32x32.png">
<title>RR - Смотрим</title>

<style>
body {
    margin: 0;
    background: #1e1e1e;
    color: #eee;
    font-family: Arial, sans-serif;
    display: flex;
    height: 100vh;
}
#sidebar {
    width: 320px;
    background: #2b2b2b;
    padding: 15px;
    overflow-y: auto;
}
#main {
    flex: 1;
    padding: 20px;
    overflow-y: auto;
    position: relative;
}
input, button {
    border-radius: 6px;
    border: none;
    background: #3a3a3a;
    color: #eee;
    margin: 6px 0;
    padding: 8px;
}
button { cursor: pointer; }
.movie-item { padding: 8px; border-bottom: 1px solid #444; cursor: pointer; }
.movie-item:hover { background: #3a3a3a; }
.selected { background: #555; }
.rating button { width: 32px; margin: 2px; }

.profile {
    position: fixed;
    bottom: 20px;
    left: 20px;
    background: #2b2b2b;
    padding: 10px 15px;
    border: 1px solid #444;
}
</style>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import { getFirestore, collection, getDocs, setDoc, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

const TMDB_API_KEY = "2ca8d6767ce5b1e65da06ab763f5c6b1";
const IMG = "https://image.tmdb.org/t/p/w300";

const firebaseConfig = {
    apiKey: "AIzaSyAankTW1IXlRygRzAFJh2r0LmE6IjJJk50",
    authDomain: "movies-b2504.firebaseapp.com",
    projectId: "movies-b2504",
    storageBucket: "movies-b2504.firebasestorage.app",
    messagingSenderId: "857966785940",
    appId: "1:857966785940:web:5f84725a9049e047068b81"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let state = { user: localStorage.getItem("movieAppUser"), movies: [], viewedOpen: false };
let selectedMovieId = null;

const sidebar = document.getElementById("sidebar");
const main = document.getElementById("main");

function avg(movie) {
    const v = Object.values(movie.userRatings || {});
    if (!v.length) return "—";
    return (v.reduce((a,b)=>a+b,0)/v.length).toFixed(1);
}

let genresMap = {};
async function loadGenres() {
    const res = await fetch(`https://api.themoviedb.org/3/genre/movie/list?api_key=${TMDB_API_KEY}&language=ru-RU`);
    const data = await res.json();
    data.genres.forEach(g => genresMap[g.id] = g.name);
}
await loadGenres();

/* 🔹 НОВОЕ: трейлер */
async function fetchTrailer(movieId) {
    const res = await fetch(`https://api.themoviedb.org/3/movie/${movieId}/videos?api_key=${TMDB_API_KEY}&language=ru-RU`);
    const data = await res.json();
    const t = data.results.find(v => v.site === "YouTube" && v.type === "Trailer");
    return t ? t.key : null;
}

async function fetchMovie(title) {
    const res = await fetch(
        `https://api.themoviedb.org/3/search/movie?api_key=${TMDB_API_KEY}&query=${encodeURIComponent(title)}&language=ru-RU`
    );
    const data = await res.json();
    const movie = data.results?.[0];
    if (!movie) return null;

    return {
        title: movie.title,
        poster: movie.poster_path ? IMG + movie.poster_path : "",
        tmdbRating: movie.vote_average?.toFixed(1) || "—",
        year: movie.release_date?.slice(0,4) || "",
        overview: movie.overview || "Описание отсутствует",
        genres: movie.genre_ids.map(id => genresMap[id]).join(", "),
        trailer: await fetchTrailer(movie.id),
        userRatings: {},
        viewedBy: {},
        createdAt: Date.now(),
        creator: state.user
    };
}

async function loadMovies() {
    const snapshot = await getDocs(collection(db, "movies"));
    state.movies = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
    render();
}

function renderSidebar() {
    sidebar.innerHTML = "<h2>Фильмы</h2>";

    state.movies.forEach(m => {
        const d = document.createElement("div");
        d.className = "movie-item" + (m.id===selectedMovieId?" selected":"");
        d.innerHTML = `<strong>${m.title}</strong><br>⭐ ${avg(m)}`;
        d.onclick = () => { selectedMovieId = m.id; render(); };
        sidebar.appendChild(d);
    });

    const i = document.createElement("input");
    i.placeholder = "Название фильма";

    const b = document.createElement("button");
    b.textContent = "➕ Добавить";

    b.onclick = async () => {
        if (!i.value.trim()) return;
        const m = await fetchMovie(i.value.trim());
        if (!m) return alert("Не найдено");
        await setDoc(doc(db, "movies", crypto.randomUUID()), m);
        i.value = "";
        loadMovies();
    };

    sidebar.appendChild(i);
    sidebar.appendChild(b);
}

function renderMain() {
    main.innerHTML = "";

    if (!state.user) {
        main.innerHTML = `
            <div class="login-container">
                <input id="nick" placeholder="Ник">
                <button id="login">Войти</button>
            </div>`;
        document.getElementById("login").onclick = () => {
            state.user = document.getElementById("nick").value.trim();
            localStorage.setItem("movieAppUser", state.user);
            render();
        };
        return;
    }

    if (!selectedMovieId) return;

    const m = state.movies.find(x => x.id === selectedMovieId);

    main.innerHTML = `
        <h2>${m.title} (${m.year})</h2>
        ${m.poster ? `<img src="${m.poster}">` : ""}
        <p>TMDb: ${m.tmdbRating}</p>
        <p>Жанры: ${m.genres}</p>
        <p><strong>Описание:</strong><br>${m.overview}</p>
        <p>Средняя оценка: ${avg(m)}</p>
    `;

    if (m.trailer) {
        main.innerHTML += `
            <h3>🎬 Трейлер</h3>
            <iframe width="560" height="315"
                src="https://www.youtube.com/embed/${m.trailer}"
                frameborder="0"
                allowfullscreen>
            </iframe>
        `;
    }
}

function render() {
    renderSidebar();
    renderMain();
}

loadMovies();
</script>
</head>
<body>
<div id="sidebar"></div>
<div id="main"></div>
</body>
</html>
