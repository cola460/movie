<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Movie App (TMDb + Firebase)</title>

<style>
body {
    margin: 0;
    background: #1e1e1e;
    color: #eee;
    font-family: Arial, sans-serif;
    display: flex;
    height: 100vh;
}
#sidebar {
    width: 320px;
    background: #2b2b2b;
    padding: 15px;
    overflow-y: auto;
}
#main {
    flex: 1;
    padding: 20px;
    overflow-y: auto;
    position: relative;
}
input, textarea, button {
    border-radius: 6px;
    border: none;
    background: #3a3a3a;
    color: #eee;
    margin: 6px 0;
    padding: 8px;
}
button { cursor: pointer; }
.movie-item { padding: 8px; border-bottom: 1px solid #444; cursor: pointer; }
.movie-item:hover { background: #3a3a3a; }
.selected { background: #555; }
.rating button { width: 32px; margin: 2px; }
.comment { font-size: 13px; border-top: 1px dashed #444; margin-top: 4px; padding-top: 4px; }

/* ПРОФИЛЬ В ЛЕВОМ НИЖНЕМ УГЛУ */
.profile {
    position: fixed;
    bottom: 20px;
    left: 20px;
    background: #2b2b2b;
    padding: 10px 15px;
    border-radius: 8px;
    border: 1px solid #444;
    box-shadow: 0 0 10px rgba(0,0,0,0.5);
}

/* КОМПАКТНОЕ ПОЛЕ КОММЕНТАРИЯ */
.comment-box {
    width: 200px;
    display: inline-block;
    vertical-align: top;
}
.comment-box + button {
    width: auto;
    margin-left: 5px;
    padding: 8px 12px;
}

/* ЛОГИН ПО ЦЕНТРУ */
.login-container {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    height: 100%;
}
.login-container input,
.login-container button {
    width: 220px;
    padding: 8px 10px;
    margin: 5px 0;
}
</style>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import { getFirestore, collection, getDocs, setDoc, doc, updateDoc, arrayUnion, deleteDoc } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

const TMDB_API_KEY = "2ca8d6767ce5b1e65da06ab763f5c6b1";
const IMG = "https://image.tmdb.org/t/p/w300";

const firebaseConfig = {
    apiKey: "AIzaSyAankTW1IXlRygRzAFJh2r0LmE6IjJJk50",
    authDomain: "movies-b2504.firebaseapp.com",
    projectId: "movies-b2504",
    storageBucket: "movies-b2504.firebasestorage.app",
    messagingSenderId: "857966785940",
    appId: "1:857966785940:web:5f84725a9049e047068b81"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let state = { user: null, movies: [] };
let selectedMovieId = null;

const sidebar = document.getElementById("sidebar");
const main = document.getElementById("main");

const savedUser = localStorage.getItem("movieAppUser");
if (savedUser) state.user = savedUser;

function avg(movie) {
    const v = Object.values(movie.userRatings || {});
    if (!v.length) return "—";
    return (v.reduce((a,b)=>a+b,0)/v.length).toFixed(1);
}

// ЖАНРЫ
let genresMap = {};
async function loadGenres() {
    const res = await fetch(`https://api.themoviedb.org/3/genre/movie/list?api_key=${TMDB_API_KEY}&language=ru-RU`);
    const data = await res.json();
    data.genres.forEach(g => genresMap[g.id] = g.name);
}
await loadGenres();

async function fetchMovie(title) {
    const res = await fetch(
        `https://api.themoviedb.org/3/search/movie?api_key=${TMDB_API_KEY}&query=${encodeURIComponent(title)}&language=ru-RU`
    );
    const data = await res.json();
    const movie = data.results?.[0] || null;
    if (!movie) return null;
    const genreNames = movie.genre_ids.map(id => genresMap[id]).join(", ");
    return { ...movie, genreNames };
}

async function loadMovies() {
    const snapshot = await getDocs(collection(db, "movies"));
    state.movies = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
    render();
}

function renderSidebar() {
    sidebar.innerHTML = "<h2>Фильмы</h2>";

    state.movies
        .sort((a,b)=>a.createdAt-b.createdAt)
        .forEach(m => {
            const d = document.createElement("div");
            d.className = "movie-item" + (m.id===selectedMovieId?" selected":"");
            d.innerHTML = `<strong>${m.title}</strong><br>⭐ ${avg(m)}`;
            d.onclick = () => { selectedMovieId = m.id; render(); };
            sidebar.appendChild(d);
        });

    const i = document.createElement("input");
    i.placeholder = "Название фильма";

    const b = document.createElement("button");
    b.textContent = "➕ Добавить";

    b.onclick = async () => {
        if (!i.value.trim()) return;
        b.disabled = true;
        b.textContent = "Поиск...";

        const m = await fetchMovie(i.value.trim());
        if (!m) { b.textContent = "Не найдено"; setTimeout(()=>{b.textContent="➕ Добавить"; b.disabled=false;},1000); return; }

        const newMovie = {
            title: m.title,
            poster: m.poster_path ? IMG + m.poster_path : "",
            tmdbRating: m.vote_average?.toFixed(1) || "—",
            year: m.release_date?.slice(0,4) || "",
            userRatings: {},
            comments: [],
            createdAt: Date.now(),
            creator: state.user,
            genres: m.genreNames
        };

        await setDoc(doc(db, "movies", crypto.randomUUID()), newMovie);
        await loadMovies();

        i.value = "";
        b.disabled = false;
        b.textContent = "➕ Добавить";
    };

    sidebar.appendChild(i);
    sidebar.appendChild(b);
}

function renderMain() {
    main.innerHTML = "";

    if (!state.user) {
        main.innerHTML = `
            <div class="login-container">
                <input id="nick" placeholder="Ник">
                <button id="login">Войти</button>
            </div>
        `;
        document.getElementById("login").onclick = () => {
            const nick = document.getElementById("nick").value.trim();
            if (!nick) return;
            state.user = nick;
            localStorage.setItem("movieAppUser", nick);
            render();
        };
        return;
    }

    const userMovies = state.movies.filter(m => m.creator === state.user);
    main.innerHTML += `
        <div class="profile">
            <strong>Профиль</strong><br>
            Ник: ${state.user}<br>
            Фильмов добавлено: ${userMovies.length}
        </div>
    `;

    if (!selectedMovieId) return;

    const m = state.movies.find(x=>x.id===selectedMovieId);

    main.innerHTML += `
        <h2>${m.title} (${m.year})</h2>
        ${m.poster ? `<img src="${m.poster}">` : ""}
        <p>TMDb: ${m.tmdbRating}</p>
        <p>Жанры: ${m.genres}</p>
        <a href="https://www.kinopoisk.ru/index.php?kp_query=${encodeURIComponent(m.title)}" target="_blank">Открыть на Кинопоиске</a>
        <p>Средняя оценка пользователей: ${avg(m)}</p>
    `;

    const r = document.createElement("div");
    r.className = "rating";
    for (let i=1;i<=10;i++) {
        const bt = document.createElement("button");
        bt.textContent = i;
        if (m.userRatings[state.user]===i) bt.style.background="#555";
        bt.onclick = async () => {
            m.userRatings[state.user] = i;
            await updateDoc(doc(db, "movies", m.id), { userRatings: m.userRatings });
            await loadMovies();
        };
        r.appendChild(bt);
    }
    main.appendChild(r);

    const ta = document.createElement("textarea");
    ta.placeholder = "Комментарий";
    ta.className = "comment-box";

    const cb = document.createElement("button");
    cb.textContent = "Ок";
    cb.onclick = async () => {
        if (!ta.value.trim()) return;
        await updateDoc(doc(db, "movies", m.id), {
            comments: arrayUnion({ user: state.user, text: ta.value })
        });
        await loadMovies();
    };

    main.appendChild(ta);
    main.appendChild(cb);

    m.comments.forEach(c=>{
        main.innerHTML += `<div class="comment"><b>${c.user}:</b> ${c.text}</div>`;
    });

    if (state.user === "Кола") {
        const delBtn = document.createElement("button");
        delBtn.textContent = "🗑 Удалить фильм";
        delBtn.style.background = "#a33";
        delBtn.style.marginTop = "10px";
        delBtn.onclick = async () => {
            if (confirm(`Вы уверены, что хотите удалить "${m.title}"?`)) {
                await deleteDoc(doc(db, "movies", m.id));
                selectedMovieId = null;
                await loadMovies();
            }
        };
        main.appendChild(delBtn);
    }
}

function render() {
    renderSidebar();
    renderMain();
}

loadMovies();
</script>
</head>
<body>
<div id="sidebar"></div>
<div id="main"></div>
</body>
</html>
