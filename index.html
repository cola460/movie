<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="favicon-32x32.png">
<title>RR - Смотрим</title>

<style>
body {
    margin: 0;
    background: #1e1e1e;
    color: #eee;
    font-family: Arial, sans-serif;
    display: flex;
    height: 100vh;
    overflow: hidden;
}

#sidebar {
    width: 320px;
    background: #2b2b2b;
    padding: 15px;
    overflow-y: auto;
}

#main {
    flex: 1;
    padding: 20px;
    overflow-y: auto;
    position: relative;
    overflow: hidden;
}

input, button {
    border-radius: 6px;
    border: none;
    background: #3a3a3a;
    color: #eee;
    margin: 6px 0;
    padding: 8px;
}

button {
    cursor: pointer;
}

.movie-item {
    padding: 8px;
    border-bottom: 1px solid #444;
    cursor: pointer;
}

.movie-item:hover {
    background: #3a3a3a;
}

.selected {
    background: #555;
}

.rating button {
    width: 32px;
    margin: 2px;
}

.profile {
    position: fixed;
    bottom: 20px;
    right: 40px;
    background: rgba(40, 40, 40, 0.7);
    padding: 15px 18px;
    border-radius: 12px;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    color: #eee;
    border: 1px solid #444;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    z-index: 10;
}

.profile strong {
    display: block;
    margin-bottom: 6px;
    font-size: 17px;
    font-weight: 600;
    letter-spacing: 0.3px;
}

.login-container {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    height: 100%;
}

.login-container input,
.login-container button {
    width: 220px;
    padding: 8px 10px;
    margin: 5px 0;
}

.add-movie-container {
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.add-movie-container input,
.add-movie-container button {
    width: 100%;
    box-sizing: border-box;
}

.viewed-container {
    margin-top: 20px;
}

.viewed-toggle {
    background: #3a3a3a;
    padding: 6px 10px;
    border: none;
    cursor: pointer;
    width: 100%;
    text-align: center;
}

.viewed-list {
    display: none;
    margin-top: 6px;
    border-top: 1px solid #444;
    padding-top: 6px;
}

/* ======= Свечение постера ======= */
.poster-main {
    position: relative;
    width: 100%;
    border-radius: 12px;
    z-index: 2;
}

.poster-ambient-bg {
    position: absolute;
    top: -50%;
    left: -50%;
    width: 300%;
    height: 300%;
    object-fit: cover;
    filter: blur(80px) saturate(1.6) brightness(1.15);
    opacity: 0.55;
    z-index: 0;
    pointer-events: none;
    border-radius: 50%;
    transform: translateX(200px) scale(1.2);
}

.poster-wrapper {
  position: relative;
  width: 300px;
}

.poster-wrapper::before {
  content: "";
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background-image: url('путь_к_постеру.jpg');
  background-size: cover;
  filter: blur(80px) saturate(1.6) brightness(1.15);
  z-index: 0;
}

.poster-wrapper img.poster-main {
  position: relative;
  z-index: 2;
  width: 100%;
  border-radius: 12px;
}

.poster-wrapper h2 {
  position: relative;
  z-index: 3;
  color: #fff;
  margin: 0 0 6px 0;
}

.right-content {
    position: relative;
    z-index: 3;
}

.movie-text-bg {
    background: rgba(40, 40, 40, 0.7);
    padding: 15px;
    border-radius: 12px;
    margin-top: 10px;
    backdrop-filter: blur(8px);
    color: #eee;
}

.tabs {
    display: flex;
    margin-bottom: 10px;
    border-bottom: 1px solid #444;
}

.tab {
    padding: 8px 14px;
    cursor: pointer;
    background: #2b2b2b;
    color: #ccc;
    border-top-left-radius: 8px;
    border-top-right-radius: 8px;
    margin-right: 6px;
}

.tab.active {
    background: #1e1e1e;
    color: #fff;
    border: 1px solid #444;
    border-bottom: none;
}

/* ===== РУЛЕТКА ===== */
.roulette-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 99999;
}

.roulette-overlay.hidden {
    display: none;
}

#rouletteCanvas {
    width: 750px;
    height: 750px;
    border-radius: 20px;
    box-shadow: 0 0 60px rgba(0,0,0,0.8);
}

.roulette-pointer {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -380px);
    font-size: 48px;
    color: #ffcc00;
    z-index: 2;
}
</style>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import { getFirestore, collection, getDocs, setDoc, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

const TMDB_API_KEY = "2ca8d6767ce5b1e65da06ab763f5c6b1";
const IMG = "https://image.tmdb.org/t/p/w300";

const firebaseConfig = {
    apiKey: "AIzaSyAankTW1IXlRygRzAFJh2r0LmE6IjJJk50",
    authDomain: "movies-b2504.firebaseapp.com",
    projectId: "movies-b2504",
    storageBucket: "movies-b2504.firebasestorage.app",
    messagingSenderId: "857966785940",
    appId: "1:857966785940:web:5f84725a9049e047068b81"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let selectedMovieId = null;
let state = {
    user: null,
    movies: [],
    viewedOpen: false,
    tab: "normal"
};

const sidebar = document.getElementById("sidebar");
const main = document.getElementById("main");

const savedUser = localStorage.getItem("movieAppUser");
if (savedUser) state.user = savedUser;

let genresMap = {};
async function loadGenres() {
    const res = await fetch(`https://api.themoviedb.org/3/genre/movie/list?api_key=${TMDB_API_KEY}&language=ru-RU`);
    const data = await res.json();
    data.genres.forEach(g => genresMap[g.id] = g.name);
}
await loadGenres();

async function fetchMovie(title, year = null) {
    const url = new URL("https://api.themoviedb.org/3/search/movie");
    url.searchParams.set("api_key", TMDB_API_KEY);
    url.searchParams.set("query", title);
    url.searchParams.set("language", "ru-RU");
    if (year) url.searchParams.set("year", year);  // добавляем фильтр по году

    const res = await fetch(url);
    const data = await res.json();

    if (!data.results || !data.results.length) return null;

    let movie = data.results.find(m => m.title.toLowerCase() === title.toLowerCase());
    if (!movie) movie = data.results[0];

    const genreNames = movie.genre_ids.map(id => genresMap[id]).join(", ");
    return { ...movie, genreNames, overview: movie.overview || "" };
}


async function fetchTrailer(movieId) {
    const res = await fetch(
        `https://api.themoviedb.org/3/movie/${movieId}/videos?api_key=${TMDB_API_KEY}&language=ru-RU`
    );
    const data = await res.json();
    const yt = data.results?.find(v => v.site === "YouTube" && v.type === "Trailer");
    return yt ? `https://www.youtube.com/embed/${yt.key}` : null;
}

async function loadMovies() {
    const snapshot = await getDocs(collection(db, "movies"));
    state.movies = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
    render();
}

function renderSidebar() {
    sidebar.innerHTML = "<h2></h2>";

    const tabs = document.createElement("div");
    tabs.className = "tabs";

    const normalTab = document.createElement("div");
    normalTab.className = "tab" + (state.tab === "normal" ? " active" : "");
    normalTab.textContent = "Обычные";
    normalTab.onclick = () => { state.tab = "normal"; render(); };

    const horrorTab = document.createElement("div");
    horrorTab.className = "tab" + (state.tab === "horror" ? " active" : "");
    horrorTab.textContent = "Ужастики";
    horrorTab.onclick = () => { state.tab = "horror"; render(); };

    tabs.appendChild(normalTab);
    tabs.appendChild(horrorTab);
    sidebar.appendChild(tabs);

    const rouletteBtn = document.createElement("button");
    rouletteBtn.textContent = "🙈🤙🍌";
    rouletteBtn.style.width = "100%";
    rouletteBtn.style.margin = "10px 0";
    rouletteBtn.style.fontSize = "16px";

    rouletteBtn.onclick = () => {
        overlay.classList.remove("hidden");
        angle = 0;
        speed = 0;
        spinning = false;

        rouletteMovies = state.movies.filter(m => {
            if (m.viewed) return false;
            const isHorror = m.genres?.toLowerCase().includes("ужасы");
            return state.tab === "horror" ? isHorror : !isHorror;
        });
        drawRoulette();
    };

    sidebar.appendChild(rouletteBtn);

    state.movies
        .filter(m => {
            if (m.viewed) return false;
            const isHorror = m.genres?.toLowerCase().includes("ужасы");
            return state.tab === "horror" ? isHorror : !isHorror;
        })
        .sort((a,b)=>b.createdAt - a.createdAt)
        .forEach(m => {
            const d = document.createElement("div");
            d.className = "movie-item" + (m.id===selectedMovieId?" selected":"");
            d.innerHTML = `<strong>${m.title}</strong> <span style="float:right; color:#ccc;">⭐ ${m.tmdbRating}</span>`;
            d.onclick = () => { selectedMovieId = m.id; render(); };
            sidebar.appendChild(d);
        });

    const container = document.createElement("div");
    container.className = "add-movie-container";

    const i = document.createElement("input");
    i.placeholder = "Название фильма";

    const b = document.createElement("button");
    b.textContent = "➕ Добавить";

    b.onclick = async () => {
        if (!i.value.trim()) return;
        b.disabled = true;
        b.textContent = "Поиск...";

     // Берем строку из поля
const input = i.value.trim();

// Ищем год в конце строки (4 цифры)
const match = input.match(/(.*)\s(\d{4})$/);

let title = input;  // по умолчанию вся строка — название
let year = null;

if (match) {
    title = match[1].trim();          // всё кроме года
    year = parseInt(match[2]);        // сам год
}

const m = await fetchMovie(title, year);
        if (!m) {
            b.textContent = "Не найдено";
            setTimeout(()=>{b.textContent="➕ Добавить"; b.disabled=false;},1000);
            return;
        }

        const trailer = await fetchTrailer(m.id);

        const newMovie = {
            title: m.title,
            poster: m.poster_path ? IMG + m.poster_path : "",
            tmdbRating: m.vote_average?.toFixed(1) || "—",
            year: m.release_date?.slice(0,4) || "",
            overview: m.overview,
            trailer: trailer,
            userRatings: {},
            createdAt: Date.now(),
            creator: state.user,
            genres: m.genreNames,
            viewed: false
        };

        await setDoc(doc(db, "movies", crypto.randomUUID()), newMovie);
        await loadMovies();

        i.value = "";
        b.disabled = false;
        b.textContent = "➕ Добавить";
    };

    container.appendChild(i);
    container.appendChild(b);
    sidebar.appendChild(container);

    const viewedContainer = document.createElement("div");
    viewedContainer.className = "viewed-container";

    const toggleBtn = document.createElement("button");
    toggleBtn.className = "viewed-toggle";
    toggleBtn.textContent = "👁 Просмотрено";

    const viewedList = document.createElement("div");
    viewedList.className = "viewed-list";
    viewedList.style.display = state.viewedOpen ? "block" : "none";

    toggleBtn.onclick = () => {
        state.viewedOpen = !state.viewedOpen;
        render();
    };

    state.movies
        .filter(m => m.viewed)
        .sort((a,b) => (b.viewedAt || 0) - (a.viewedAt || 0))
        .forEach(m => {
            const d = document.createElement("div");
            d.className = "movie-item" + (m.id===selectedMovieId?" selected":"");
            d.innerHTML = `<strong>${m.title}</strong> <span style="float:right; color:#ccc;">⭐ ${m.tmdbRating}</span>`;
            d.onclick = () => { selectedMovieId = m.id; render(); };
            viewedList.appendChild(d);
        });

    viewedContainer.appendChild(toggleBtn);
    viewedContainer.appendChild(viewedList);
    sidebar.appendChild(viewedContainer);
}

function renderMain() {
    main.innerHTML = "";

    if (!state.user) {
        main.innerHTML = `
            <div class="login-container">
                <input id="nick" placeholder="Ник">
                <button id="login">Войти</button>
            </div>
        `;
        document.getElementById("login").onclick = () => {
            const nick = document.getElementById("nick").value.trim();
            if (!nick) return;
            state.user = nick;
            localStorage.setItem("movieAppUser", nick);
            render();
        };
        return;
    }

    const userMovies = state.movies.filter(m => m.creator === state.user);
    main.innerHTML += `
        <div class="profile">
            <strong>${state.user}</strong>
            Добавлено фильмов: ${userMovies.length}
        </div>
    `;

    if (!selectedMovieId) return;

    const m = state.movies.find(x => x.id === selectedMovieId);

// Основной блок с постером
main.innerHTML += `
<div style="position: relative; width:300px; z-index:2; display: flex; flex-direction: column; gap: 6px;">
    <!-- Заголовок сверху, в потоке -->
    <h2 style="color: #fff; font-size: 24px; margin-top: 10; z-index:10; margin:0 0 15px 0; white-space: nowrap;">
        ${m.title} (${m.year})
    </h2>

    <!-- Постер -->
    ${m.poster ? `<img class="poster-main" src="${m.poster}" style="border-radius:12px; width:100%; z-index:2;">` : ""}

    <!-- Контейнер для текста под кнопкой просмотрено -->
    <div id="viewedBtnContainer" style="margin-top:10px; z-index:10;"></div>

    <!-- Свечение постера -->
    ${m.poster ? `
        <div style="
            position:absolute;
            top:50%; left:50%;
            width:1900px; height:900px;
            transform: translate(-50%, -50%) scale(1.2);
            z-index:0;
            pointer-events:none;
            border-radius:50%;
            overflow:hidden;
            filter: blur(80px) saturate(1.6) brightness(1.15);
            opacity:0.55;
        ">
            <img src="${m.poster}" style="width:100%; height:100%; object-fit:cover;">
        </div>
    ` : ""}
</div>

`;


    if (state.user === "Кола") {
        const viewedBtn = document.createElement("button");
        viewedBtn.textContent = m.viewed ? "👁 Просмотрено" : "👁 Просмотрено";
        viewedBtn.style.display = "block";
        viewedBtn.style.marginTop = "10px";
        viewedBtn.onclick = async () => {
            await updateDoc(doc(db, "movies", m.id), { viewed: true, viewedAt: Date.now() });
            await loadMovies();
        };
        main.appendChild(viewedBtn);
    }

    const textDiv = document.createElement("div");
    textDiv.className = "movie-text-bg";
    textDiv.style.marginTop = "10px"; 
    textDiv.style.width = "500px";     
    textDiv.innerHTML = `
        <p>TMDb: ${m.tmdbRating}</p>
        <p>Жанры: ${m.genres}</p>
        ${m.overview ? `<p><strong>Описание:</strong><br>${m.overview}</p>` : ""}
    `;
    document.getElementById("viewedBtnContainer").appendChild(textDiv);

    if (state.user === "Кола") {
        const delBtn = document.createElement("button");
        delBtn.textContent = "🗑 Удалить фильм";
        delBtn.style.background = "#a33";
        delBtn.style.marginTop = "10px";
        delBtn.onclick = async () => {
            if (confirm(`Вы уверены, что хотите удалить "${m.title}"?`)) {
                await deleteDoc(doc(db, "movies", m.id));
                selectedMovieId = null;
                await loadMovies();
            }
        };
        main.appendChild(delBtn);
    }

    if (m.poster && m.trailer) {
        const posterImg = document.querySelector(".poster-main");
        posterImg.style.cursor = "pointer";

        posterImg.onclick = () => {
            const overlay = document.createElement("div");
            overlay.style.position = "fixed";
            overlay.style.top = "0";
            overlay.style.left = "0";
            overlay.style.width = "100vw";
            overlay.style.height = "100vh";
            overlay.style.background = "rgba(0,0,0,0.8)";
            overlay.style.display = "flex";
            overlay.style.justifyContent = "center";
            overlay.style.alignItems = "center";
            overlay.style.zIndex = "9999";

            const trailerContainer = document.createElement("div");
            trailerContainer.style.position = "relative";

            const iframe = document.createElement("iframe");
            iframe.src = m.trailer;
            iframe.width = "888";
            iframe.height = "500";
            iframe.frameBorder = "0";
            iframe.allowFullscreen = true;
            iframe.style.borderRadius = "12px";

            const closeBtn = document.createElement("button");
            closeBtn.textContent = "✖";
            closeBtn.style.position = "absolute";
            closeBtn.style.top = "-30px";
            closeBtn.style.right = "-30px";
            closeBtn.style.fontSize = "24px";
            closeBtn.style.background = "#a33";
            closeBtn.style.color = "#fff";
            closeBtn.style.border = "none";
            closeBtn.style.borderRadius = "50%";
            closeBtn.style.width = "40px";
            closeBtn.style.height = "40px";
            closeBtn.style.cursor = "pointer";
            closeBtn.onclick = () => document.body.removeChild(overlay);

            trailerContainer.appendChild(iframe);
            trailerContainer.appendChild(closeBtn);
            overlay.appendChild(trailerContainer);
            document.body.appendChild(overlay);
        };
    }
}

// ===== Рулетка =====
const overlay = document.getElementById("rouletteOverlay");
const canvas = document.getElementById("rouletteCanvas");
const ctx = canvas.getContext("2d");

let angle = 0;
let speed = 0;
let spinning = false;
const rouletteColors = ["#f1b71c","#0c9e2f","#3e72e9","#d72135"];
let previousIndex = -1;
let rouletteMovies = [];

document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
        overlay.classList.add("hidden");
        spinning = false;
    }
});

function startRoulette() {
    if (rouletteMovies.length === 0) {
        rouletteMovies = state.movies.filter(m => {
            if (m.viewed) return false;
            const isHorror = m.genres?.toLowerCase().includes("ужасы");
            return state.tab === "horror" ? isHorror : !isHorror;
        });
    }

    if (!rouletteMovies.length) {
        alert("Нет фильмов 😢");
        return;
    }

    angle = 0;
    speed = Math.random() * 0.3 + 0.35;
    spinning = true;
    overlay.classList.remove("hidden");
    requestAnimationFrame(spin);
    previousIndex = -1;
}

function spin() {
    if (!spinning) return;
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const cx = 375, cy = 375, radius = 350;
    const slice = (Math.PI * 2) / rouletteMovies.length;

    const pointerAngle = (-Math.PI/2 - angle) % (Math.PI*2);
    const normalized = (pointerAngle + 2*Math.PI) % (2*Math.PI);
    const currentIndex = Math.floor(normalized / slice);

    if (currentIndex !== previousIndex) {
// speed примерно от 0 (медленно) до 0.5 (быстро)
const maxVolume = 0.3;       // максимальная громкость
const minVolume = 0.03;      // минимальная громкость на большой скорости
const normalizedVolume = maxVolume - speed * (maxVolume - minVolume);

const tick = new Audio('tick.mp3');
tick.volume = Math.max(normalizedVolume, minVolume); // чтобы громкость не ушла в 0
tick.play();


        previousIndex = currentIndex;
    }

    rouletteMovies.forEach((m,i)=>{
        const start = angle + i*slice;
        const end = start + slice;
        ctx.beginPath();
        ctx.moveTo(cx,cy);
        ctx.arc(cx,cy,radius,start,end);
        ctx.fillStyle = rouletteColors[i % rouletteColors.length];
        ctx.fill();
        ctx.strokeStyle = "#ffffff55";
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.save();
        ctx.translate(cx,cy);
        ctx.rotate(start + slice/2);
        ctx.textAlign = "right";
        ctx.fillStyle = "#fff";
        ctx.font = "bold 23px Arial";
        ctx.shadowColor = "rgba(0,0,0,0.6)";
        ctx.shadowBlur = 4;
        ctx.fillText(m.title.slice(0,22), radius-14,5);
        ctx.shadowBlur = 0;
        ctx.restore();
    });

    ctx.beginPath();
    ctx.arc(cx,cy,10,0,Math.PI*2);
    ctx.fillStyle = "#ffd166";
    ctx.fill();

    angle += speed;
    speed *= 0.992;

    if (speed < 0.0002) {
        spinning = false;
        const pointerAngleFinal = (-Math.PI/2 - angle) % (2*Math.PI);
        const normalizedFinal = (pointerAngleFinal + 2*Math.PI) % (2*Math.PI);
        const finalIndex = Math.floor(normalizedFinal / slice);
        rouletteMovies.splice(finalIndex,1);
        angle = 0;
        drawRoulette();
        return;
    }

    requestAnimationFrame(spin);
}

function drawRoulette() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    const cx = 375, cy = 375, radius = 350;
    const slice = (Math.PI*2)/rouletteMovies.length;

    rouletteMovies.forEach((m,i)=>{
        const start = i*slice;
        const end = start + slice;
        ctx.beginPath();
        ctx.moveTo(cx,cy);
        ctx.arc(cx,cy,radius,start,end);
        ctx.fillStyle = rouletteColors[i % rouletteColors.length];
        ctx.fill();
        ctx.strokeStyle = "#ffffff55";
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.save();
        ctx.translate(cx,cy);
        ctx.rotate(start + slice/2);
        ctx.textAlign = "right";
        ctx.fillStyle = "#fff";
        ctx.font = "bold 23px Arial";
        ctx.shadowColor = "rgba(0,0,0,0.6)";
        ctx.shadowBlur = 4;
        ctx.fillText(m.title.slice(0,22), radius-14,5);
        ctx.shadowBlur = 0;
        ctx.restore();
    });

    ctx.beginPath();
    ctx.arc(cx,cy,10,0,Math.PI*2);
    ctx.fillStyle = "#ffd166";
    ctx.fill();
}

canvas.style.cursor = "pointer";
canvas.addEventListener("click", ()=>{ if(!spinning) startRoulette(); });

function render() {
    renderSidebar();
    renderMain();
}

loadMovies();
</script>
</head>
<body>
<div id="sidebar"></div>
<div id="main"></div>
<div id="rouletteOverlay" class="roulette-overlay hidden">
    <div class="roulette-pointer">▼</div>
